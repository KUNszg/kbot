apiVersion: apps/v1
kind: Deployment
metadata:
  name: kbot-job-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kbot-job-manager
  template:
    metadata:
      labels:
        app: kbot-job-manager
    spec:
      containers:
        - name: kbot-job-manager
          image: docker-registry.kunszg.com/kbot-job-manager:latest
          imagePullPolicy: Always
          volumeMounts:
            - name: node-modules-volume
              mountPath: /usr/src/app/node_modules
          envFrom:
            - configMapRef:
                name: kbot-config
      imagePullSecrets:
        - name: regcred-v1
      volumes:
        - name: node-modules-volume
          hostPath:
            path: /home/docker/node_modules
            type: Directory
