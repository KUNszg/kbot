apiVersion: apps/v1
kind: Deployment
metadata:
  name: kbot-mirrors-twitch-chat-queue-filler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kbot-mirrors-twitch-chat-queue-filler
  template:
    metadata:
      labels:
        app: kbot-mirrors-twitch-chat-queue-filler
    spec:
      containers:
        - name: kbot-mirrors-twitch-chat-queue-filler
          image: docker-registry.app.kunszg.com/kbot-mirrors:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: kbot-config
          env:
            - name: APP_NAME
              value: "TWITCH_CHAT_QUEUE_FILLER"
      imagePullSecrets:
        - name: regcred-v1
